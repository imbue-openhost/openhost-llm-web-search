<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/htmx.min.js"></script>
</head>
<body>
    <nav>
        <a href="/" class="nav-brand">Search</a>
        <a href="/settings">Settings</a>
    </nav>
    <main>
        <h1>Settings</h1>
        <form hx-post="/settings" hx-target="#save-status" hx-swap="innerHTML" class="settings-form">
            <div class="field">
                <label for="searxng_url">SearxNG URL</label>
                <input type="text" id="searxng_url" name="searxng_url" value="{{.Settings.SearxngURL}}" placeholder="http://searxng.example.com:8080">
                <span class="hint">The base URL of your SearxNG instance (must have JSON format enabled)</span>
            </div>
            <div class="field">
                <label for="llm_url">LLM API Base URL</label>
                <input type="text" id="llm_url" name="llm_url" value="{{.Settings.LLMURL}}" placeholder="https://api.openai.com">
                <span class="hint">OpenAI-compatible API base URL. For Anthropic use https://api.anthropic.com/v1</span>
            </div>
            <div class="field">
                <label for="llm_api_key">API Key</label>
                <input type="password" id="llm_api_key" name="llm_api_key" placeholder="{{if .MaskedKey}}Current: {{.MaskedKey}} (leave blank to keep){{else}}sk-...{{end}}">
            </div>
            <div class="field">
                <label for="llm_model">Model</label>
                <input type="text" id="llm_model" name="llm_model" value="{{.Settings.LLMModel}}" placeholder="gpt-4o-mini">
                <span class="hint">Model name (e.g. gpt-4o-mini, claude-sonnet-4-20250514)</span>
            </div>
            <button type="submit">Save Settings</button>
            <div id="save-status"></div>
        </form>
    </main>
</body>
</html>
